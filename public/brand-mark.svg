<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Osman Beyhan compass mark">
  <defs>
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="needleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1d20"/>
      <stop offset="100%" stop-color="#5c1012"/>
    </linearGradient>
    <linearGradient id="cardinal" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#efefef"/>
      <stop offset="100%" stop-color="#8d8d8d"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#0d0f0f"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2a2e2e" stroke-width="1"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#9f1d20" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#232727" stroke-width="1"/>

  <!-- ticks -->
  <g stroke="#3a4040" stroke-width="0.8">
    <line x1="100" y1="26" x2="100" y2="32" stroke="#9f1d20" stroke-width="1.4"/>
    <line x1="174" y1="100" x2="168" y2="100" stroke="#9f1d20" stroke-width="1.4"/>
    <line x1="100" y1="174" x2="100" y2="168" stroke="#9f1d20" stroke-width="1.4"/>
    <line x1="26" y1="100" x2="32" y2="100" stroke="#9f1d20" stroke-width="1.4"/>
  </g>

  <g fill="#777" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="middle">
    <text x="100" y="30">N</text>
    <text x="172" y="104">E</text>
    <text x="100" y="178">S</text>
    <text x="28" y="104">W</text>
  </g>

  <g>
    <path d="M100 48 L104.5 100 L100 92 L95.5 100 Z" fill="#4a5050" transform="rotate(45 100 100)"/>
    <path d="M100 48 L104.5 100 L100 92 L95.5 100 Z" fill="#4a5050" transform="rotate(135 100 100)"/>
    <path d="M100 48 L104.5 100 L100 92 L95.5 100 Z" fill="#4a5050" transform="rotate(225 100 100)"/>
    <path d="M100 48 L104.5 100 L100 92 L95.5 100 Z" fill="#4a5050" transform="rotate(315 100 100)"/>

    <path d="M100 36 L108 100 L100 90 L92 100 Z" fill="url(#needleLight)"/>
    <path d="M100 164 L108 100 L100 110 L92 100 Z" fill="url(#needleDark)"/>
    <path d="M164 100 L100 106 L110 100 L100 94 Z" fill="url(#cardinal)" opacity="0.9"/>
    <path d="M36 100 L100 106 L90 100 L100 94 Z" fill="url(#cardinal)" opacity="0.9"/>
  </g>

  <circle cx="100" cy="100" r="14" fill="#0d0f0f" stroke="#3a4040" stroke-width="1.25"/>
  <circle cx="100" cy="100" r="8" fill="none" stroke="#9f1d20" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="3.5" fill="#e8e8e8"/>
